name: Bug report
description: Something does not behave as documented or as the tests say it should.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security problems must not be filed here**: use the private
        "Report a vulnerability" form (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
      placeholder: |
        1. ...
        2. ...
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Git commit or tag you ran, or the deployed contract id / API URL.
      placeholder: "main @ abc1234"
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - testnet
        - local / tests only
        - mainnet
        - not applicable
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Transaction hashes, event ids, log lines, error messages, screenshots. Redact anything private. Never paste secret keys.
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser and wallet (frontend), Bun / Node / Rust / stellar CLI versions (backend, contracts).
