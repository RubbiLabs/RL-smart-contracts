name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: fmt, clippy, test, wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain, target and components pinned in
      # rust-toolchain.toml and caches ~/.cargo and target/.
      - name: Install Rust (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""

      - name: Install stellar-cli 28.1.0
        uses: stellar/stellar-cli@v28.1.0

      - name: Install just (pinned)
        uses: extractions/setup-just@v2
        with:
          just-version: "1.39.0"

      - name: Versions
        run: |
          rustc --version
          cargo --version
          stellar --version
          just --version

      - name: Run CI gate (just check)
        run: just check

      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v7
        with:
          name: contracts-wasm
          path: target/wasm32v1-none/release/*.wasm
          if-no-files-found: error
