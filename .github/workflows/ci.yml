name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: fmt, clippy, test, wasm build
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs (the tag they resolved
      # to is in the trailing comment); review the diff before bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain, target and components pinned in
      # rust-toolchain.toml and caches ~/.cargo and target/.
      - name: Install Rust (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""

      - name: Install stellar-cli 28.1.0
        uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0

      - name: Versions
        run: |
          rustc --version
          cargo --version
          stellar --version

      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh

      - name: README error tables match errors.rs
        run: scripts/check-readme-errors.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build contracts (wasm32v1-none)
        run: stellar contract build

      - name: Test upgrade paths against the built wasm
        run: |
          cargo test -p rubbi-vault --features wasm-upgrade-test
          cargo test -p rubbi-subscriptions --features wasm-upgrade-test
          cargo test -p rubbi-payroll --features wasm-upgrade-test

      - name: Upload wasm artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contracts-wasm
          path: target/wasm32v1-none/release/*.wasm
          if-no-files-found: error
